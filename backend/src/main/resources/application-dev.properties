spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/quizhub?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.flyway.enabled=false

app.jwt.secret=${APP_JWT_SECRET:quizhub-local-development-only-secret-key-change-before-deploy}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
app.seed.demo-data=${SEED_DEMO_DATA:true}
